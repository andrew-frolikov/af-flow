name: AFFlow
options:
  bundleIdPrefix: com.frolikov
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "16.0"

packages:
  WhisperKit:
    url: https://github.com/argmaxinc/WhisperKit.git
    from: "0.16.0"
  FluidAudio:
    url: https://github.com/FluidInference/FluidAudio.git
    from: "0.13.6"
  LLM.swift:
    url: https://github.com/obra/LLM.swift.git
    revision: c2144e1a0e29c280ec6080b7da85e876d51f8509

targets:
  AFFlow:
    type: application
    platform: macOS
    configFiles:
      Debug: Config/Signing.xcconfig
      Release: Config/Signing.xcconfig
    sources:
      - AFFlow
    settings:
      base:
        INFOPLIST_FILE: AFFlow/Info.plist
        PRODUCT_NAME: AF Flow
        PRODUCT_MODULE_NAME: AFFlow
        CODE_SIGN_ENTITLEMENTS: AFFlow/AFFlow.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_BUNDLE_IDENTIFIER: "$(AF_FLOW_BUNDLE_ID:default=com.frolikov.afflow)"
        ENABLE_APP_SANDBOX: YES
        CODE_SIGN_ALLOW_ENTITLEMENTS_MODIFICATION: YES
        ENABLE_HARDENED_RUNTIME: NO
    dependencies:
      - package: WhisperKit
      - package: FluidAudio
      - package: LLM.swift
        product: LLM
    entitlements:
      path: AFFlow/AFFlow.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.device.audio-input: true
        com.apple.security.files.user-selected.read-write: true
        com.apple.security.network.client: true

  AFFlowTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - AFFlowTests
    dependencies:
      - target: AFFlow
    settings:
      base:
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/AF Flow.app/Contents/MacOS/AF Flow"
        BUNDLE_LOADER: "$(TEST_HOST)"
        GENERATE_INFOPLIST_FILE: YES

  CleanupModelProbe:
    type: tool
    platform: macOS
    sources:
      - CleanupModelProbe
      - CleanupModelProbeSupport
    dependencies:
      - package: LLM.swift
        product: LLM
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.frolikov.afflow.cleanup-model-probe
        GENERATE_INFOPLIST_FILE: YES
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/Frameworks"
